version: "3"

services:
    app:
      container_name: lsapi
      restart: always
      build: .
      ports:
        - "5000:3000"
      links:
        - database     
      volumes:
        - .:/code
        - /code/node_modules  #Volumen dedicado al node_modules para que quede intacto #bcrypt issue  https://bobcares.com/blog/install-bcrypt-in-docker/       
    database:
      container_name: lsdb
      image: mysql
      command: --default-authentication-plugin=mysql_native_password
      restart: always  
      ports:
        - "6000:3306"    
      environment:
        MYSQL_ROOT_PASSWORD: b4s34p1
        MYSQL_DATABASE: loteriadb
        

